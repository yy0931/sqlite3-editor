[package]
name = "sqlite3-editor"
version = "1.0.208"
edition = "2021"

[features]
sqlite = ["rusqlite/bundled"]
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
clap = { version = "4.4.3", features = ["derive"] }
percent-encoding = "2.3.0"
regex = "1.9.5"
rmp = "0.8.12"
rmp-serde = "1.1.2"
serde = { version = "1.0.188", features = ["derive", "rc"] }
serde_json = "1.0.107"
serde-transcode = "1.1.1"
sqlparser = "0.37.0"
csv = "1.2.2"
base64 = "0.21.4"
hex = "0.4.3"
ts-rs = "7.0.0"
once_cell = "1.20.2"

# We can't use rust_xlsxwriter>=0.67.0 because it doesn't compile on aarch64.
# rust_xlsxwriter>=0.67.0 uses thiserror-impl 2.0.11 via zip 2.2.2, and it throws the error: "linking with `cc` failed: ..." on aarch64 builds.
rust_xlsxwriter = "0.66.0"

[dependencies.rusqlite]
git = "https://github.com/yy0931/rusqlite.git"
branch = "master"
features = ["functions", "load_extension", "modern_sqlite"]

[dev-dependencies]
tempfile = "3.8.0"

[profile.release]
strip = true       # 8.2MB -> 7.0MB
lto = true         # 7.0MB -> 6.2MB
opt-level = "z"    # 6.2MB -> 4.3MB
codegen-units = 1  # 4.3MB -> 4.2MB
# Do not use "panic = "abort" as it causes the executable to throw STATUS_ENTRYPOINT_NOT_FOUND on Windows 7.
